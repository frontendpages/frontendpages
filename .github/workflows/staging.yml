name: Staging / Preview

permissions:
  id-token: write
  contents: read

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy-web-preview:
    name: Deploy Website (Preview)
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/infisical
        with:
          env-slug: staging

      - name: Pull Vercel environment
        run: pnpx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build
        run: pnpx vercel build --token=$VERCEL_TOKEN

      - name: Deploy
        run: pnpx vercel deploy --prebuilt --archive=tgz --token=$VERCEL_TOKEN
