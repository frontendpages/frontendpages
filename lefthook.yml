commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    renovate:
      glob: "{renovate.json,.github/renovate.json}"
      run: pnpm exec renovate-config-validator --strict {staged_files}
    varlock-scan:
      run: pnpm exec varlock scan --staged
