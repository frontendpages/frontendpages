  "@sentry/nextjs": 10.57.0
  "@t3-oss/env-nextjs": ^0.13.11
  "@tailwindcss/postcss": ^4.3.2
  "@types/node": ^24.13.3
  drizzle-orm: 0.45.2
  motion: ^12.42.2
  "server-only": 0.0.1
  tailwindcss: ^4.3.2
  typescript: ^5.9.3
  zod: 4.4.3
catalogs:
  auth:
    "@better-auth/infra": 0.2.14
    better-auth: 1.6.23
  next:
    next: 16.2.10
  orpc:
    "@orpc/client": 1.14.7
    "@orpc/server": 1.14.7
    "@orpc/tanstack-query": 1.14.7
  react:
    "@types/react": 19.2.17
    "@types/react-dom": 19.2.3
    react: 19.2.7
    "react-dom": 19.2.7
  tanstack:
    "@tanstack/react-query": ^5.101.2
    "@tanstack/react-query-devtools": ^5.101.2
