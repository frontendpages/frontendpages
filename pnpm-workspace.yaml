  "@sentry/nextjs": 11.7.0
  "@tailwindcss/postcss": 4.3.3
  "@types/node": 26.6.5
  "@varlock/infisical-plugin": 2.1.3
  "@varlock/nextjs-integration": 1.2.4
  motion: 14.1.0
  "server-only": 0.0.1
  tailwindcss: 4.3.3
  typescript: 7.0.2
  varlock: 1.22.0
  zod: 4.6.6
catalogs:
  auth:
    better-auth: 1.7.7
  drizzle:
    drizzle-kit: 1.0.0-rc.5-5935859
    drizzle-orm: 1.0.0-rc.5-5935859
  next:
    next: 16.4.0
  orpc:
    "@orpc/client": 1.15.6
    "@orpc/server": 1.15.6
    "@orpc/tanstack-query": 1.15.6
  react:
    "@types/react": 19.3.0
